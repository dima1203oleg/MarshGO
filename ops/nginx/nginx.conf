worker_processes 1;

events { worker_connections 1024; }

http {
    include       mime.types;
    default_type  application/octet-stream;
    sendfile        on;
    keepalive_timeout  65;

    # Docker recreates upstream containers with new addresses. Resolving the
    # service names once at start would keep serving whichever container later
    # took the cached address, so every upstream is resolved per request here.
    resolver 127.0.0.11 valid=10s ipv6=off;

    # Passengers on Ukrainian mobile networks otherwise download the API's
    # journey and network JSON uncompressed. text/event-stream is deliberately
    # absent from gzip_types, and the WebSocket upgrade responses are never
    # buffered for compression, so realtime streams keep flushing per frame.
    gzip on;
    gzip_vary on;
    gzip_comp_level 5;
    gzip_min_length 1024;
    gzip_proxied any;
    gzip_types text/plain text/css application/javascript application/json image/svg+xml;

    server {
        listen 8080;
        server_name _;

        # Web & PWA
        location / {
            set $marshgo_web http://web:8080;
            proxy_pass $marshgo_web$uri$is_args$args;
            proxy_http_version 1.1;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection "upgrade";
        }

        # API direct fallback
        location /api/ {
            set $marshgo_api http://api:3002;
            proxy_pass $marshgo_api$uri$is_args$args;
            proxy_http_version 1.1;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection "upgrade";
            proxy_read_timeout 75s;
        }

        # Admin
        location /admin/ {
            set $marshgo_admin http://admin:8080;
            rewrite ^/admin/(.*)$ /$1 break;
            proxy_pass $marshgo_admin$uri$is_args$args;
            proxy_http_version 1.1;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }

        # Partner
        location /partner/ {
            set $marshgo_partner http://partner:8080;
            rewrite ^/partner/(.*)$ /$1 break;
            proxy_pass $marshgo_partner$uri$is_args$args;
            proxy_http_version 1.1;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }

        # Tiles
        location /tiles/ {
            proxy_pass http://host.docker.internal:3306/;
            proxy_http_version 1.1;
            proxy_set_header Host $host;
        }
    }
}
