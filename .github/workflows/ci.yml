name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgis/postgis:17-3.5
        env:
          POSTGRES_DB: marshgo_e2e
          POSTGRES_USER: marshgo
          POSTGRES_PASSWORD: local_only_change_me
        ports:
          - 5434:5432
        options: >-
          --health-cmd "pg_isready -U marshgo -d marshgo_e2e"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 20
      redis:
        image: redis:7.4-alpine
        ports:
          - 6380:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 20
    env:
      E2E_DATABASE_URL: postgres://marshgo:local_only_change_me@127.0.0.1:5434/marshgo_e2e
      REDIS_URL: redis://127.0.0.1:6380
      SESSION_SECRET: test-only-marshgo-ci-session-secret-32chars
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24.21.0
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.5
      - run: bun install --frozen-lockfile
      - run: bun audit --audit-level=high
      - run: npm run lint:all
      - run: npm run typecheck
      - run: npm test
      - run: DATABASE_URL="$E2E_DATABASE_URL" npm run db:migrate
      - run: API_TEST_DATABASE_URL="$E2E_DATABASE_URL" npm run test:integration
      - run: npm run build
      - run: npm run check:bundle
      - name: Configure read-only access to private Admin and Partner repositories
        env:
          MARSHGO_REPOS_READ_TOKEN: ${{ secrets.MARSHGO_REPOS_READ_TOKEN }}
        run: |
          if [[ -z "$MARSHGO_REPOS_READ_TOKEN" ]]; then
            echo "::error title=Missing private repository read token::Set the MARSHGO_REPOS_READ_TOKEN Actions secret with read-only Contents access to MarshGO-Admin and MarshGO-Partner."
            exit 1
          fi
          askpass="$RUNNER_TEMP/marshgo-git-askpass"
          cat > "$askpass" <<'ASKPASS'
          #!/bin/sh
          case "${1-}" in
            *sername*) printf '%s\n' 'x-access-token' ;;
            *assword*) printf '%s' "${MARSHGO_REPOS_READ_TOKEN:?}" ;;
            *) exit 1 ;;
          esac
          ASKPASS
          chmod 700 "$askpass"
          {
            echo "GIT_ASKPASS=$askpass"
            echo "GIT_ASKPASS_REQUIRE=force"
            echo "GIT_TERMINAL_PROMPT=0"
            echo "MARSHGO_REPOS_READ_TOKEN=$MARSHGO_REPOS_READ_TOKEN"
          } >> "$GITHUB_ENV"
      - run: node ops/scripts/materialize-release.mjs
      - run: node --test ops/scripts/release-build-metadata.test.mjs
      - run: docker compose --project-name marshgo-canonical-build --env-file ops/templates/production.env.example -f .release/compose.production.yml build api web admin partner
      - name: Verify pinned API identity inside the built image
        run: |
          node --input-type=module <<'NODE'
          import assert from 'node:assert/strict';
          import { execFileSync } from 'node:child_process';
          import { readFileSync } from 'node:fs';

          const metadata = JSON.parse(readFileSync('.release/materialized.json', 'utf8')).buildMetadata;
          const manifest = JSON.parse(readFileSync('RELEASE_MANIFEST.json', 'utf8'));
          assert.equal(metadata.commitSha, manifest.server_sha, 'build identity must match the exact pinned Server SHA');
          assert.equal(metadata.sourceState, 'clean', 'only clean pinned source is promoted into the image');
          const releaseTag = readFileSync('ops/templates/production.env.example', 'utf8').match(/^MARSHGO_RELEASE_TAG=(.+)$/m)?.[1];
          assert.ok(releaseTag, 'production example must provide an immutable image tag');
          const image = JSON.parse(execFileSync('docker', ['image', 'inspect', `marshgo/api:${releaseTag}`], { encoding: 'utf8' }))[0];
          const environment = new Map(image.Config.Env.map((entry) => {
            const separator = entry.indexOf('=');
            return [entry.slice(0, separator), entry.slice(separator + 1)];
          }));
          assert.equal(environment.get('MARSHGO_BUILD_ID'), metadata.buildId);
          assert.equal(environment.get('MARSHGO_BUILD_SHA'), metadata.commitSha);
          assert.equal(environment.get('MARSHGO_BUILD_TIME'), metadata.builtAt);
          assert.equal(environment.get('MARSHGO_SOURCE_STATE'), metadata.sourceState);
          assert.equal(image.Config.Labels['org.opencontainers.image.revision'], metadata.commitSha);
          console.log(`Verified API image ${releaseTag} -> Server ${metadata.commitSha} (${metadata.buildId})`);
          NODE
      - run: npx playwright install --with-deps chromium firefox webkit
      - name: Install Mesa and virtual display for Firefox WebGL
        run: sudo apt-get update && sudo apt-get install -y libgl1-mesa-dri xvfb xauth
      # Browser tests exercise the canonical Site repository at the immutable SHA
      # in RELEASE_MANIFEST.json, served against the pinned API release.
      - name: Build the pinned canonical Site for browser tests
        run: |
          node scripts/build-pwa.mjs
          site_sha="$(node -e 'process.stdout.write(JSON.parse(require("node:fs").readFileSync("RELEASE_MANIFEST.json", "utf8")).site_sha)')"
          echo "E2E_DIST_DIR=$GITHUB_WORKSPACE/.release/site-${site_sha}/dist" >> "$GITHUB_ENV"
      - run: npm run test:e2e
      - name: Upload Playwright diagnostics on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: marshgo-playwright-failure-${{ github.run_id }}
          path: test-results/
          if-no-files-found: ignore
          retention-days: 3
      - run: xvfb-run -a npm run test:browser-compat
        env:
          LIBGL_ALWAYS_SOFTWARE: '1'
          MARSHGO_FIREFOX_XVFB: '1'
      - name: Upload cross-browser diagnostics on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: marshgo-browser-compat-failure-${{ github.run_id }}
          path: test-results/
          if-no-files-found: ignore
          retention-days: 3
