openapi: 3.1.0
info:
  title: MARSHGO Navigation API
  version: 1.0.0
  description: Versioned navigation and compressed routing contracts. The legacy /routing/route endpoint remains unchanged during migration.
servers:
  - url: /api/v1
paths:
  /places/reverse:
    get:
      operationId: reverseGeocode
      security: [{ bearerAuth: [] }]
      parameters:
        - { name: lat, in: query, required: true, schema: { type: number, minimum: -90, maximum: 90 } }
        - { name: lon, in: query, required: true, schema: { type: number, minimum: -180, maximum: 180 } }
      responses:
        '200': { description: Reverse geocoded place }
        '400': { description: Invalid coordinate }
        '404': { description: No place found }
        '503': { description: Geocoding provider unavailable }
  /routing/calculate:
    post:
      operationId: calculateRoute
      security: [{ bearerAuth: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/RouteRequest' }
      responses:
        '200':
          description: Canonical route result
          content:
            application/json:
              schema:
                type: object
                required: [data]
                properties:
                  data: { $ref: '#/components/schemas/RouteResult' }
        '400': { description: Invalid route request }
        '503': { description: Routing provider unavailable }
  /navigation/sessions/{id}/reroute:
    post:
      operationId: rerouteNavigation
      security: [{ bearerAuth: [] }]
      parameters:
        - { name: id, in: path, required: true, schema: { type: string, format: uuid } }
      responses:
        '200': { description: New server-authoritative route version }
        '403': { description: Driver role required }
        '409': { description: Stale GPS or concurrent session update }
        '503': { description: Routing provider unavailable }
components:
  securitySchemes:
    bearerAuth: { type: http, scheme: bearer }
  schemas:
    Coordinate:
      type: array
      prefixItems: [{ type: number, minimum: -180, maximum: 180 }, { type: number, minimum: -90, maximum: 90 }]
      minItems: 2
      maxItems: 2
    RouteRequest:
      type: object
      required: [origin, destination, profile, requestId]
      properties:
        origin: { $ref: '#/components/schemas/Coordinate' }
        destination: { $ref: '#/components/schemas/Coordinate' }
        waypoints: { type: array, maxItems: 30, items: { $ref: '#/components/schemas/Coordinate' } }
        profile:
          type: object
          required: [mode]
          properties:
            mode: { type: string, enum: [CAR, TAXI, VAN, EV] }
        departureAt: { type: string, format: date-time }
        alternatives: { type: boolean }
        language: { type: string, maxLength: 20 }
        requestId: { type: string, minLength: 1, maxLength: 128 }
    RouteResult:
      type: object
      required: [id, provider, geometry, bounds, distanceMeters, durationSeconds, trafficAware, legs, maneuvers, confidence, calculatedAt, routeVersion]
      properties:
        id: { type: string }
        provider: { type: string }
        providerRouteId: { type: string }
        geometry:
          type: object
          required: [encoding, value]
          properties:
            encoding: { const: polyline6 }
            value: { type: string, minLength: 4 }
        bounds: { type: array, minItems: 2, maxItems: 2, items: { $ref: '#/components/schemas/Coordinate' } }
        distanceMeters: { type: number, minimum: 0 }
        durationSeconds: { type: number, minimum: 0 }
        durationWithoutTrafficSeconds: { type: number, minimum: 0 }
        trafficDelaySeconds: { type: number, minimum: 0 }
        trafficAware: { type: boolean }
        legs: { type: array, items: { type: object, required: [distanceMeters, durationSeconds], properties: { distanceMeters: { type: number }, durationSeconds: { type: number } } } }
        maneuvers: { type: array, items: { type: object } }
        confidence: { type: string, enum: [BASELINE, ESTIMATED, TRAFFIC_AWARE, LIVE] }
        calculatedAt: { type: string, format: date-time }
        routeVersion: { type: integer, minimum: 1 }
        mapDataVersion: { type: string }
        providerDataVersion: { type: string }
        metadata: { type: object, additionalProperties: true }
